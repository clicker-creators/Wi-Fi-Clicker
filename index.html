<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THE NUMBER: EMPIRE</title>
    <style>
        :root {
            --pop-yellow: #fff000;
            --pop-pink: #ff007c;
            --pop-blue: #00e5ff;
            --pop-purple: #7000ff;
            --bg: #050505;
        }
        body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background: var(--bg);
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Arial Black', sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none; color: white;
        }

        /* 背景：サンバースト */
        #sunburst {
            position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax;
            margin-left: -100vmax; margin-top: -100vmax;
            background: conic-gradient(from 0deg, transparent 0deg 15deg, rgba(255, 255, 255, 0.03) 15deg 30deg);
            background-size: 30deg 30deg; animation: rotateSun 20s linear infinite;
            pointer-events: none; z-index: 1;
        }
        @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* メイン統計（上部） */
        #stats-container { margin-top: 15dvh; text-align: center; z-index: 50; pointer-events: none; }
        #mps-display { font-size: 6vw; color: var(--pop-blue); font-weight: 900; margin-top: 5px; opacity: 0.8; }

        /* 中央のコア・ナンバー（クリック対象そのもの） */
        #core-wrapper { 
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90vw; text-align: center; cursor: pointer; z-index: 100;
        }
        #score-display { 
            display: inline-block; font-size: 22vw; font-weight: 900; 
            color: var(--pop-yellow); filter: drop-shadow(0 0 15px var(--pop-yellow));
            line-height: 1; transition: transform 0.05s;
        }
        
        /* クリック時の衝撃 */
        .pop-hit { animation: coreHit 0.1s ease-out; }
        @keyframes coreHit { 
            0% { transform: scale(1); } 
            50% { transform: scale(1.15) rotate(2deg); color: white; } 
            100% { transform: scale(1); } 
        }

        /* パーティクル */
        .particle { position: absolute; pointer-events: none; font-weight: 900; z-index: 200; animation: particleOut 0.5s ease-out forwards; white-space: nowrap; }
        @keyframes particleOut { 
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; } 
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5); opacity: 0; } 
        }

        /* 下部ボタン */
        #footer { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; z-index: 110; }
        #shop-trigger {
            background: var(--pop-pink); color: white; border: 4px solid white; padding: 18px 50px; border-radius: 50px;
            font-size: 24px; font-weight: 900; cursor: pointer; box-shadow: 0 8px 0 #b30057; transition: 0.1s;
        }
        #shop-trigger:active { transform: translateY(4px); box-shadow: 0 4px 0 #b30057; }

        /* ショップ：買えないときは灰色 */
        #shop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0a0a0a; z-index: 500; display: none; flex-direction: column; box-sizing: border-box; border: 8px solid var(--pop-purple); }
        #shop-header { padding: 25px; text-align: center; background: var(--pop-purple); }
        #shop-list { flex: 1; overflow-y: auto; padding: 10px 0; }
        
        .shop-item {
            background: #1a1a1a; border: 2px solid #333; margin: 8px 15px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center; border-radius: 15px;
            filter: grayscale(1) opacity(0.5); /* 買えないときは灰色・半透明 */
            transition: 0.2s; pointer-events: none;
        }
        .shop-item.can-buy { 
            filter: grayscale(0) opacity(1); /* 買えるようになるとカラーに */
            border-color: var(--pop-blue); 
            pointer-events: auto;
            cursor: pointer;
        }
        .shop-item.can-buy:active { transform: scale(0.96); background: #222; }

        .item-name { font-size: 18px; color: var(--pop-blue); font-weight: 900; display: block; }
        .item-cost { font-size: 14px; color: var(--pop-yellow); font-family: monospace; }
        .item-count { font-size: 32px; color: #333; font-weight: 900; }
        .can-buy .item-count { color: var(--pop-purple); opacity: 0.3; }

        #close-shop { margin: 20px; background: white; color: black; border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: 900; }
    </style>
</head>
<body>

    <div id="sunburst"></div>

    <div id="stats-container">
        <div id="mps-display">0 /s</div>
    </div>

    <div id="core-wrapper">
        <div id="score-display">0</div>
    </div>

    <div id="footer">
        <button id="shop-trigger" onclick="toggleShop(true)">UPGRADE SHOP</button>
    </div>

    <div id="shop-overlay">
        <div id="shop-header">
            <h1 style="margin:0; font-size: 32px;">EMPIRE UPGRADE</h1>
            <div id="shop-current-score" style="font-size: 18px; color: var(--pop-yellow);">0</div>
        </div>
        <div id="shop-list"></div>
        <button id="close-shop" onclick="toggleShop(false)">BACK TO EMPIRE</button>
    </div>

    <script>
        let score = 0;
        const items = [
            { name: "Basic Miner", cost: 15, mps: 1, count: 0 },
            { name: "Logic Drone", cost: 100, mps: 5, count: 0 },
            { name: "Data Tower", cost: 1100, mps: 40, count: 0 },
            { name: "Core Reactor", cost: 12000, mps: 350, count: 0 },
            { name: "Global Server", cost: 130000, mps: 2000, count: 0 },
            { name: "Void Engine", cost: 1400000, mps: 15000, count: 0 }
        ];

        function initShop() {
            const container = document.getElementById('shop-list');
            container.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.id = `item-${i}`;
                div.onclick = () => buyItem(i);
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-cost" id="cost-${i}">$ ${item.cost.toLocaleString()}</span>
                    </div>
                    <div class="item-count" id="count-${i}">0</div>
                `;
                container.appendChild(div);
            });
        }

        function toggleShop(show) {
            document.getElementById('shop-overlay').style.display = show ? 'flex' : 'none';
            updateUI();
        }

        function handleAction(e) {
            if (e.type === 'touchstart' && e.cancelable) e.preventDefault();
            
            const display = document.getElementById('score-display');
            display.classList.remove('pop-hit');
            void display.offsetWidth;
            display.classList.add('pop-hit');

            let clickPower = 1 + Math.floor(getTotalMps() * 0.1);
            score += clickPower;

            const x = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
            const y = (e.type === 'touchstart') ? e.touches[0].clientY : e.clientY;
            
            createParticle(x, y, clickPower);
            updateUI();
        }

        function createParticle(x, y, val) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.innerText = `+${val.toLocaleString()}`;
            p.style.color = Math.random() > 0.5 ? 'var(--pop-yellow)' : 'white';
            p.style.left = x + 'px'; p.style.top = y + 'px';
            p.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
            p.style.setProperty('--ty', (Math.random() - 1.0) * 200 + 'px');
            document.body.appendChild(p);
            setTimeout(() => p.remove(), 500);
        }

        function getTotalMps() { return items.reduce((sum, item) => sum + (item.mps * item.count), 0); }

        function buyItem(id) {
            if (score >= items[id].cost) {
                score -= items[id].cost;
                items[id].count++;
                items[id].cost = Math.floor(items[id].cost * 1.3);
                updateUI();
            }
        }

        function updateUI() {
            const roundedScore = Math.floor(score);
            const scoreStr = roundedScore.toLocaleString();
            document.getElementById('score-display').innerText = scoreStr;
            document.getElementById('shop-current-score').innerText = scoreStr + " POINTS";
            document.getElementById('mps-display').innerText = `${getTotalMps().toLocaleString()} /s`;
            
            items.forEach((item, i) => {
                const el = document.getElementById(`item-${i}`);
                document.getElementById(`cost-${i}`).innerText = `$ ${item.cost.toLocaleString()}`;
                document.getElementById(`count-${i}`).innerText = item.count;
                
                if (score >= item.cost) {
                    el.classList.add('can-buy');
                } else {
                    el.classList.remove('can-buy');
                }
            });
        }

        // 自動増加 (100msごとに1/10ずつ加算)
        setInterval(() => {
            score += (getTotalMps() / 10);
            updateUI();
        }, 100);

        initShop();
        const core = document.getElementById('core-wrapper');
        core.addEventListener('touchstart', handleAction, { passive: false });
        core.addEventListener('mousedown', handleAction);
        updateUI();
    </script>
</body>
</html>
