<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fiクリッカー - Clicker Creators</title>
    <style>
        body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background: radial-gradient(circle at center, #1a4a72 0%, #051622 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
        }

        #collection-counter {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 20px; font-weight: bold; background: rgba(255,255,255,0.1);
            padding: 5px 15px; border-radius: 20px; z-index: 100;
        }

        #score-container { position: absolute; top: 10dvh; text-align: center; z-index: 10; }
        #score-display { font-size: 56px; color: white; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        #unit { font-size: 24px; color: #87CEEB; margin-top: -5px; }
        #level-display { color: #87CEEB; font-weight: bold; letter-spacing: 2px; margin-bottom: 5px; }

        #wifi-container {
            width: 75vmin; height: 75vmin; cursor: pointer; position: relative; z-index: 5;
            transition: transform 0.05s ease-out;
        }
        #wifi-container:active { transform: scale(0.97); }

        #wifi-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 15px rgba(0,0,0,0.6)); }

        .wifi-arc {
            stroke-width: 2px;
            stroke-linecap: butt; /* カクカク */
            fill: none;
            stroke: #000;
        }

        /* 実際に色が変わる層 */
        .wifi-fill {
            stroke-width: 1.8px;
            stroke-linecap: butt;
            fill: none;
            transition: stroke 0.05s linear;
        }

        #arc-point { fill: #000; stroke: none; transition: fill 0.2s; }

        .plus-one {
            position: absolute; color: white; font-weight: bold; font-size: 32px;
            pointer-events: none; z-index: 20; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes flash {
            0% { background-color: white; opacity: 0.8; }
            100% { background-color: transparent; opacity: 0; }
        }
        .clear-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div id="collection-counter">📡 × <span id="cleared-count">0</span></div>

    <div id="score-container">
        <div id="level-display">Lv.1 Wi-Fi</div>
        <div id="score-display">0</div>
        <div id="unit">Mbps</div>
    </div>

    <div id="wifi-container">
        <svg id="wifi-svg" viewBox="0 0 24 24">
            <defs>
                <linearGradient id="wifi-fill-grad" x1="0%" y1="100%" x2="0%" y2="0%">
                    <stop id="stop-white" offset="0%" stop-color="#FFFFFF" />
                    <stop id="stop-gray" offset="0%" stop-color="#444444" />
                </linearGradient>
            </defs>
            
            <circle id="arc-point" cx="12" cy="18" r="2.2"></circle>
            <path class="wifi-arc" d="M8.5 14a6 6 0 0 1 7 0"></path>
            <path class="wifi-arc" d="M5 10.5a11 11 0 0 1 14 0"></path>
            <path class="wifi-arc" d="M1.5 7a16 16 0 0 1 21 0"></path>

            <path class="wifi-fill" d="M8.5 14a6 6 0 0 1 7 0" stroke="url(#wifi-fill-grad)"></path>
            <path class="wifi-fill" d="M5 10.5a11 11 0 0 1 14 0" stroke="url(#wifi-fill-grad)"></path>
            <path class="wifi-fill" d="M1.5 7a16 16 0 0 1 21 0" stroke="url(#wifi-fill-grad)"></path>
        </svg>
    </div>

    <script>
        let score = 0;
        let clearedCount = 0;
        let level = 1;
        const targetScore = 3000;

        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const clearedDisplay = document.getElementById('cleared-count');
        const wifiContainer = document.getElementById('wifi-container');
        const stopWhite = document.getElementById('stop-white');
        const stopGray = document.getElementById('stop-gray');
        const arcPoint = document.getElementById('arc-point');

        function handleAction(e) {
            if (e.cancelable) e.preventDefault();
            score++;
            updateDisplay();

            if (score >= targetScore) {
                completeLevel();
                return;
            }

            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            if (x && y) createPlusOne(x, y);
        }

        function updateDisplay() {
            scoreDisplay.innerText = score.toLocaleString();
            let progress = (score / targetScore) * 100;
            
            // グラデーションの境界を完全に一致させて「水位」を表現
            stopWhite.setAttribute('offset', `${progress}%`);
            stopGray.setAttribute('offset', `${progress}%`);

            // 点の着色ロジック
            if (score >= 100) {
                arcPoint.style.fill = '#FFFFFF';
            } else {
                arcPoint.style.fill = '#000000';
            }
        }

        function completeLevel() {
            clearedCount++;
            level++;
            score = 0;

            const f = document.createElement('div');
            f.className = 'clear-flash';
            f.style.animation = 'flash 0.5s ease-out';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 500);

            clearedDisplay.innerText = clearedCount;
            levelDisplay.innerText = `Lv.${level} Wi-Fi`;
            updateDisplay();
        }

        function createPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            el.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: 'translate(-50%, -140px) scale(1.3)', opacity: 0 }
            ], { duration: 600, easing: 'ease-out' }).onfinish = () => el.remove();
        }

        // Pointerdown を使いつつ、念のため二重実行されないよう管理
        wifiContainer.addEventListener('pointerdown', handleAction, { passive: false });
    </script>
</body>
</html>
