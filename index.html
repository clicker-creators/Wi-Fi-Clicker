<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fiクリッカー - clicker-creators</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            /* 深い青のグラデーション背景（Cookie Clicker風） */
            background: radial-gradient(circle at center, #1a4a72 0%, #051622 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* スコア表示 */
        #score-container {
            position: absolute;
            top: 12dvh;
            text-align: center;
            z-index: 10;
        }

        #score-display {
            font-size: 48px;
            color: white;
            font-weight: 900;
            text-shadow: 0 0 15px rgba(255,255,255,0.5);
        }

        #unit {
            font-size: 20px;
            color: #87CEEB;
            margin-left: 5px;
        }

        /* Wi-Fiアイコン */
        #wifi-container {
            width: 70vmin;
            height: 70vmin;
            cursor: pointer;
            position: relative;
            z-index: 5;
            transition: transform 0.05s active;
        }

        #wifi-container:active {
            transform: scale(0.95);
        }

        /* SVGのスタイル：黒い輪郭線を表現 */
        #wifi-svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }

        .wifi-arc {
            fill: #444444; /* デフォルトの灰色 */
            stroke: #000;  /* 黒の輪郭 */
            stroke-width: 0.5px;
            transition: fill 0.3s ease, filter 0.3s ease;
        }

        /* 白く染まった状態（発光エフェクト） */
        .wifi-arc.active {
            fill: #FFFFFF;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
        }

        /* ポップアップテキスト */
        .plus-one {
            position: absolute;
            color: white;
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            z-index: 20;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="score-container">
        <div id="score-display">0</div>
        <div id="unit">Mbps</div>
    </div>

    <div id="wifi-container">
        <svg id="wifi-svg" viewBox="0 0 24 24">
            <circle class="wifi-arc" id="arc-point" cx="12" cy="18" r="2"></circle>
            <path class="wifi-arc" id="arc-low" d="M8.53 14.11a6 6 0 0 1 6.95 0"></path>
            <path class="wifi-arc" id="arc-mid" d="M5 10.55a11 11 0 0 1 14.08 0"></path>
            <path class="wifi-arc" id="arc-high" d="M1.42 7a16 16 0 0 1 21.16 0"></path>
        </svg>
    </div>

    <script>
        let score = 0;
        const scoreDisplay = document.getElementById('score-display');
        const wifiContainer = document.getElementById('wifi-container');

        const arcPoint = document.getElementById('arc-point');
        const arcLow = document.getElementById('arc-low');
        const arcMid = document.getElementById('arc-mid');
        const arcHigh = document.getElementById('arc-high');

        // 二重クリック防止用の統合ハンドラ（pointerdownはiOS/Android/PC全てで動作）
        function handleAction(e) {
            e.preventDefault();
            
            score++;
            scoreDisplay.innerText = score.toLocaleString();

            // 目標値に応じた色の変化
            if (score >= 100) arcPoint.classList.add('active');
            if (score >= 300) arcLow.classList.add('active');
            if (score >= 800) arcMid.classList.add('active');
            if (score >= 3000) arcHigh.classList.add('active');

            // エフェクト座標取得
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (x && y) createPlusOne(x, y);
        }

        function createPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            el.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: 'translate(-50%, -120px) scale(1.2)', opacity: 0 }
            ], {
                duration: 600,
                easing: 'ease-out'
            }).onfinish = () => el.remove();
        }

        // pointerdownイベントに集約することで二重入力を防ぐ
        wifiContainer.addEventListener('pointerdown', handleAction, { passive: false });

        // ダブルタップでズームされるのを防止
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
