<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>THE VOID - SCORE</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: radial-gradient(circle, #004d61 0%, #001a22 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* 右上のスコア表示 */
        #score-container {
            position: absolute;
            top: 20px;
            right: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-family: 'Inter', 'Arial', sans-serif;
            font-size: 24px;
            font-weight: 200;
            letter-spacing: 4px;
            z-index: 100;
        }

        /* ブラックホール本体 */
        #blackhole {
            width: 150px;
            height: 150px;
            background: #000;
            border-radius: 50%;
            box-shadow: 0 0 50px 10px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 2;
            transition: transform 0.05s linear;
        }

        /* 吸い込まれるエフェクト文字 */
        .plus-one {
            position: absolute;
            color: white;
            font-family: 'Arial', sans-serif;
            font-weight: bold;
            font-size: 20px;
            pointer-events: none;
            z-index: 3;
        }

        /* 縦向き時の警告 */
        @media screen and (orientation: portrait) {
            body::after {
                content: "Please rotate your device to landscape";
                position: fixed;
                inset: 0;
                background: #001a22;
                color: white;
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 999;
                font-family: sans-serif;
            }
        }
    </style>
</head>
<body onclick="absorb(event)" ontouchstart="absorb(event)">

    <div id="score-container">0</div>
    <div id="blackhole"></div>

    <script>
        let score = 0;
        let currentScale = 1;
        
        // --- ここで巨大化のスピードを調整できます ---
        // 1.001     : 結構すぐ大きくなる
        // 1.0001    : じわじわ大きくなる
        // 1.0000001 : ほぼ変わらない（修行レベル）
        const growthRate = 1.0001; 
        
        const blackhole = document.getElementById('blackhole');
        const scoreDisplay = document.getElementById('score-container');

        function absorb(e) {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!x || !y) return;

            // スコア更新
            score++;
            scoreDisplay.innerText = score.toLocaleString();

            // 巨大化
            currentScale *= growthRate;
            // あまりにも大きくなりすぎて画面を突き抜けないためのストッパー（任意）
            if (currentScale < 10) {
                blackhole.style.transform = `scale(${currentScale})`;
            }

            createPlusOne(x, y);
        }

        function createPlusOne(startX, startY) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = startX + 'px';
            el.style.top = startY + 'px';
            document.body.appendChild(el);

            const bhRect = blackhole.getBoundingClientRect();
            const centerX = bhRect.left + bhRect.width / 2;
            const centerY = bhRect.top + bhRect.height / 2;

            const animation = el.animate([
                { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                { transform: `translate(${centerX - startX}px, ${centerY - startY}px) scale(0)`, opacity: 0 }
            ], {
                duration: 500,
                easing: 'ease-in'
            });

            animation.onfinish = () => el.remove();
        }

        // ダブルタップズーム防止
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>
</html>
