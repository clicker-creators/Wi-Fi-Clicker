<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fiクリッカー - Clicker Creators</title>
    <style>
        body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background: radial-gradient(circle at center, #1a4a72 0%, #051622 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        #collection-counter {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 20px; font-weight: bold; background: rgba(255,255,255,0.1);
            padding: 5px 15px; border-radius: 20px; z-index: 100;
        }

        #score-container { position: absolute; top: 10dvh; text-align: center; z-index: 10; pointer-events: none; }
        #score-display { font-size: 56px; color: white; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        #unit { font-size: 24px; color: #87CEEB; margin-top: -5px; }
        #level-display { color: #87CEEB; font-weight: bold; letter-spacing: 2px; }

        /* Wi-Fiアイコンの土台 */
        #wifi-wrapper {
            width: 75vmin; height: 75vmin;
            position: relative;
            cursor: pointer;
            z-index: 5;
        }

        /* 全てのSVGを重ねるための基本スタイル */
        .wifi-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .wifi-path {
            fill: none;
            stroke-width: 2.2px;
            stroke-linecap: butt; /* カクカク */
        }

        /* 1. 下層：灰色のWi-Fi（背景） */
        #wifi-bg { z-index: 1; }
        
        /* 2. 中層：白いWi-Fi（水位で隠す箱） */
        #wifi-fill-container {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%;
            height: 0%; /* ここを 0% 〜 100% に動かす */
            overflow: hidden; /* 箱からはみ出た白Wi-Fiを隠す */
            z-index: 2;
            pointer-events: none;
        }

        /* 3. 輪郭：黒い縁取り（一番上） */
        #wifi-outline { z-index: 3; pointer-events: none; }

        .plus-one {
            position: absolute; color: white; font-weight: bold; font-size: 32px;
            pointer-events: none; z-index: 20; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes flash {
            0% { background-color: white; opacity: 0.8; }
            100% { background-color: transparent; opacity: 0; }
        }
        .clear-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div id="collection-counter">📡 × <span id="cleared-count">0</span></div>

    <div id="score-container">
        <div id="level-display">Lv.1 Wi-Fi</div>
        <div id="score-display">0</div>
        <div id="unit">Mbps</div>
    </div>

    <div id="wifi-wrapper">
        <svg class="wifi-layer" id="wifi-bg" viewBox="0 0 24 24">
            <circle cx="12" cy="18" r="2.2" fill="#444444" />
            <path class="wifi-path" d="M8.5 14a6 6 0 0 1 7 0" stroke="#444444" />
            <path class="wifi-path" d="M5 10.5a11 11 0 0 1 14 0" stroke="#444444" />
            <path class="wifi-path" d="M1.5 7a16 16 0 0 1 21 0" stroke="#444444" />
        </svg>

        <div id="wifi-fill-container">
            <svg style="width:75vmin; height:75vmin; position:absolute; bottom:0; left:0;" viewBox="0 0 24 24">
                <circle cx="12" cy="18" r="2.2" fill="#FFFFFF" />
                <path class="wifi-path" d="M8.5 14a6 6 0 0 1 7 0" stroke="#FFFFFF" />
                <path class="wifi-path" d="M5 10.5a11 11 0 0 1 14 0" stroke="#FFFFFF" />
                <path class="wifi-path" d="M1.5 7a16 16 0 0 1 21 0" stroke="#FFFFFF" />
            </svg>
        </div>

        <svg class="wifi-layer" id="wifi-outline" viewBox="0 0 24 24">
            <circle cx="12" cy="18" r="2.2" fill="none" stroke="#000" stroke-width="0.3" />
            <path class="wifi-path" d="M8.5 14a6 6 0 0 1 7 0" stroke="#000" stroke-width="0.3" />
            <path class="wifi-path" d="M5 10.5a11 11 0 0 1 14 0" stroke="#000" stroke-width="0.3" />
            <path class="wifi-path" d="M1.5 7a16 16 0 0 1 21 0" stroke="#000" stroke-width="0.3" />
        </svg>
    </div>

    <script>
        let score = 0;
        let clearedCount = 0;
        let level = 1;
        const targetScore = 3000;

        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const clearedDisplay = document.getElementById('cleared-count');
        const wifiWrapper = document.getElementById('wifi-wrapper');
        const wifiFillContainer = document.getElementById('wifi-fill-container');

        function handleAction(e) {
            e.preventDefault();
            score++;
            
            scoreDisplay.innerText = score.toLocaleString();
            
            // 水位の箱の高さを 0% 〜 100% で更新
            // ※Wi-Fiアイコンは中央にあるので、実際は 10% 〜 90% くらいで全部染まります
            let progress = (score / targetScore) * 100;
            wifiFillContainer.style.height = `${progress}%`;

            if (score >= targetScore) {
                completeLevel();
            } else {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                if (x && y) createPlusOne(x, y);
            }
        }

        function completeLevel() {
            clearedCount++;
            level++;
            score = 0;

            const f = document.createElement('div');
            f.className = 'clear-flash';
            f.style.animation = 'flash 0.5s ease-out';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 500);

            clearedDisplay.innerText = clearedCount;
            levelDisplay.innerText = `Lv.${level} Wi-Fi`;
            wifiFillContainer.style.height = `0%`;
            scoreDisplay.innerText = "0";
        }

        function createPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            document.body.appendChild(el);

            el.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: 'translate(-50%, -140px) scale(1.3)', opacity: 0 }
            ], { duration: 600, easing: 'ease-out' }).onfinish = () => el.remove();
        }

        wifiWrapper.addEventListener('pointerdown', handleAction, { passive: false });
    </script>
</body>
</html>
