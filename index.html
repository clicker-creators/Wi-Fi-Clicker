<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fi Clicker: Ultimate Pop</title>
    <style>
        :root {
            --pop-yellow: #fff000;
            --pop-pink: #ff007c;
            --pop-blue: #00e5ff;
            --bg: #051622;
        }
        body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background: radial-gradient(circle at center, #1a4a72 0%, var(--bg) 100%);
            display: flex; flex-direction: column; align-items: center;
            font-family: 'Arial Black', sans-serif;
            user-select: none; -webkit-user-select: none; touch-action: none; color: white;
        }

        /* 背景：サンバースト */
        #sunburst {
            position: absolute; top: 50%; left: 50%; width: 200vmax; height: 200vmax;
            margin-left: -100vmax; margin-top: -100vmax;
            background: conic-gradient(from 0deg, transparent 0deg 10deg, rgba(255, 255, 255, 0.08) 10deg 20deg);
            background-size: 20deg 20deg; animation: rotateSun 30s linear infinite;
            pointer-events: none; z-index: 1;
        }
        @keyframes rotateSun { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* UI 上部 */
        #header { position: absolute; top: 20px; width: 92%; display: flex; justify-content: space-between; z-index: 110; pointer-events: none; }
        .ui-pill { background: rgba(0,0,0,0.6); border: 3px solid white; padding: 8px 16px; border-radius: 50px; font-weight: 900; font-size: 14px; pointer-events: auto; box-shadow: 4px 4px 0px rgba(0,0,0,0.3); }

        /* メイン統計 */
        #stats-container { margin-top: 10dvh; text-align: center; z-index: 50; pointer-events: none; }
        #target-info { font-size: 16px; color: var(--pop-yellow); text-transform: uppercase; letter-spacing: 2px; -webkit-text-stroke: 1px black; }
        #score-display { font-size: 50px; font-weight: 900; filter: drop-shadow(3px 3px 0px black); margin: 5px 0; }
        #mps-display { font-size: 20px; color: var(--pop-blue); -webkit-text-stroke: 1px black; font-weight: 900; }

        /* Wi-Fi アイコン */
        #wifi-wrapper { width: 68vmin; height: 68vmin; position: relative; cursor: pointer; z-index: 100; display: flex; justify-content: center; align-items: center; }
        .wifi-svg { filter: drop-shadow(0 0 15px rgba(255,255,255,0.5)); pointer-events: none; width: 100%; height: 100%; }
        
        .pop-jump { animation: popJump 0.15s ease-out; }
        @keyframes popJump { 0% { transform: scale(1); } 50% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1); } }

        /* エフェクト */
        .particle { position: absolute; pointer-events: none; border-radius: 50%; z-index: 150; animation: particleOut 0.5s ease-out forwards; }
        @keyframes particleOut { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; } }
        .floating-text { position: absolute; pointer-events: none; font-weight: 900; font-size: 32px; color: var(--pop-yellow); -webkit-text-stroke: 2px black; z-index: 200; }

        /* ショップボタン */
        #footer { position: absolute; bottom: 40px; width: 100%; display: flex; justify-content: center; z-index: 110; }
        #shop-trigger {
            background: var(--pop-pink); color: white; border: 5px solid black; padding: 15px 50px; border-radius: 20px;
            font-size: 24px; font-weight: 900; cursor: pointer; box-shadow: 8px 8px 0px black; transition: 0.1s;
        }
        #shop-trigger:active { transform: translate(4px, 4px); box-shadow: 4px 4px 0px black; }

        /* ショップ画面 */
        #shop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--pop-blue); z-index: 500; display: none; flex-direction: column; align-items: center; }
        #shop-header { background: var(--pop-yellow); width: 100%; padding: 25px 0; border-bottom: 8px solid black; text-align: center; }
        #shop-header h2 { margin: 0; font-size: 36px; color: black; transform: skewX(-5deg); }
        #shop-list { width: 95%; overflow-y: auto; flex: 1; padding: 15px 0; }
        
        .shop-item {
            background: white; border: 5px solid black; border-radius: 20px; margin: 12px; padding: 15px 20px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 8px 8px 0px rgba(0,0,0,0.1);
        }
        .shop-item.disabled { background: #bbb; opacity: 0.6; }
        .item-name { font-size: 18px; color: black; font-weight: 900; }
        .item-eff { font-size: 14px; color: #555; font-weight: bold; }
        .item-cost { font-size: 16px; color: var(--pop-pink); font-weight: 900; display: block; margin-top: 4px; }
        .item-count { font-size: 36px; color: #ccc; -webkit-text-stroke: 2px black; font-weight: 900; }

        #close-shop { margin: 20px 0 30px; background: black; color: white; border: none; padding: 15px 60px; border-radius: 40px; font-size: 20px; font-weight: 900; cursor: pointer; }
    </style>
</head>
<body>

    <div id="sunburst"></div>

    <div id="header">
        <div class="ui-pill" id="level-display">Lv.1 Wi-Fi</div>
        <div class="ui-pill">📡 Completed: <span id="cleared-count">0</span></div>
    </div>

    <div id="stats-container">
        <div id="target-info">GOAL: 3,000 Mbps</div>
        <div id="score-display">0</div>
        <div id="mps-display">0 Mbps/s</div>
    </div>

    <div id="wifi-wrapper">
        <svg class="wifi-svg" viewBox="0 0 24 24">
            <defs>
                <clipPath id="water-clip"><rect id="water-rect" x="0" y="21" width="24" height="24" /></clipPath>
            </defs>
            <g stroke="black" fill="none" stroke-width="2.5" stroke-linecap="round">
                <circle cx="12" cy="18" r="2.2" fill="black" stroke="none" />
                <path d="M8.5 14a6 6 0 0 1 7 0" /><path d="M5 10.5a11 11 0 0 1 14 0" /><path d="M1.5 7a16 16 0 0 1 21 0" />
            </g>
            <g clip-path="url(#water-clip)" stroke="white" fill="none" stroke-width="2.5" stroke-linecap="round">
                <circle cx="12" cy="18" r="2.2" fill="white" stroke="none" />
                <path d="M8.5 14a6 6 0 0 1 7 0" /><path d="M5 10.5a11 11 0 0 1 14 0" /><path d="M1.5 7a16 16 0 0 1 21 0" />
            </g>
        </svg>
    </div>

    <div id="footer">
        <button id="shop-trigger" onclick="toggleShop(true)">SHOP / UPGRADE</button>
    </div>

    <div id="shop-overlay">
        <div id="shop-header">
            <h2>WI-FI SHOP</h2>
            <div id="shop-current-score" style="font-size: 22px; font-weight: 900; color: black;">0 Mbps</div>
        </div>
        <div id="shop-list"></div>
        <button id="close-shop" onclick="toggleShop(false)">BACK TO GAME</button>
    </div>

    <script>
        let score = 0;
        let clearedCount = 0;
        let level = 1;
        let targetScore = 3000;
        let isLevelingUp = false;

        const items = [
            { name: "Old Router", cost: 15, mps: 1, count: 0 },
            { name: "Signal Booster", cost: 200, mps: 10, count: 0 },
            { name: "Fiber Optic", cost: 2500, mps: 80, count: 0 },
            { name: "5G Base Station", cost: 15000, mps: 500, count: 0 },
            { name: "Satellite Link", cost: 100000, mps: 2500, count: 0 },
            { name: "Ocean Fiber", cost: 800000, mps: 12000, count: 0 },
            { name: "Urban 6G Tower", cost: 5000000, mps: 65000, count: 0 },
            { name: "Quantum Net", cost: 40000000, mps: 400000, count: 0 },
            { name: "Global Relay", cost: 300000000, mps: 2500000, count: 0 },
            { name: "Universal Wi-Fi", cost: 2000000000, mps: 15000000, count: 0 }
        ];

        function initShop() {
            const container = document.getElementById('shop-list');
            container.innerHTML = '';
            items.forEach((item, i) => {
                const div = document.createElement('div');
                div.className = 'shop-item';
                div.id = `item-${i}`;
                div.onclick = () => buyItem(i);
                div.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <span class="item-eff">+${item.mps.toLocaleString()} Mbps/s</span>
                        <span class="item-cost" id="cost-${i}">$ ${item.cost.toLocaleString()}</span>
                    </div>
                    <div class="item-count" id="count-${i}">0</div>
                `;
                container.appendChild(div);
            });
        }

        function toggleShop(show) {
            document.getElementById('shop-overlay').style.display = show ? 'flex' : 'none';
            if(show) updateUI();
        }

        function handleAction(e) {
            if (isLevelingUp) return;
            if (e.type === 'touchstart' && e.cancelable) e.preventDefault();
            
            // アイコンアニメーション
            const wrapper = document.getElementById('wifi-wrapper');
            wrapper.classList.remove('pop-jump');
            void wrapper.offsetWidth;
            wrapper.classList.add('pop-jump');

            let clickPower = 1 + Math.floor(level * 0.5) + Math.floor(getTotalMps() * 0.05);
            score += clickPower;

            const x = (e.type === 'touchstart') ? e.touches[0].clientX : e.clientX;
            const y = (e.type === 'touchstart') ? e.touches[0].clientY : e.clientY;
            
            createParticles(x, y);
            createFloatingText(x, y, clickPower);

            if (score >= targetScore) triggerClearSequence();
            else updateUI();
        }

        function createParticles(x, y) {
            const colors = ['#fff000', '#ff007c', '#00e5ff', '#ffffff'];
            for (let i = 0; i < 6; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                const size = Math.random() * 12 + 8;
                p.style.width = size + 'px'; p.style.height = size + 'px';
                p.style.background = colors[Math.floor(Math.random() * colors.length)];
                p.style.left = x + 'px'; p.style.top = y + 'px';
                p.style.setProperty('--tx', (Math.random() - 0.5) * 150 + 'px');
                p.style.setProperty('--ty', (Math.random() - 0.5) * 150 + 'px');
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 500);
            }
        }

        function createFloatingText(x, y, val) {
            const el = document.createElement('div');
            el.className = 'floating-text'; el.innerText = `+${val.toLocaleString()}`;
            el.style.left = x + 'px'; el.style.top = y + 'px';
            document.body.appendChild(el);
            el.animate([{ transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }, { transform: 'translate(-50%, -150px) scale(1.4)', opacity: 0 }], { duration: 600 }).onfinish = () => el.remove();
        }

        function getTotalMps() { return items.reduce((sum, item) => sum + (item.mps * item.count), 0); }

        function buyItem(id) {
            if (score >= items[id].cost && !isLevelingUp) {
                score -= items[id].cost;
                items[id].count++;
                items[id].cost = Math.floor(items[id].cost * 1.3);
                updateUI();
            }
        }

        function updateUI() {
            const fs = Math.floor(score).toLocaleString();
            document.getElementById('score-display').innerText = fs;
            document.getElementById('shop-current-score').innerText = fs + " Mbps";
            document.getElementById('target-info').innerText = `GOAL: ${targetScore.toLocaleString()} Mbps`;
            
            // 水位ロジック (y=21が空, y=0.5が満タン)
            const Y_START = 21, Y_MAX = 0.5;
            let currentY = (score >= targetScore) ? Y_MAX : Y_START - ((Y_START - Y_MAX) * (score / targetScore));
            document.getElementById('water-rect').setAttribute('y', currentY);
            
            document.getElementById('mps-display').innerText = `${getTotalMps().toLocaleString()} Mbps/s`;
            document.getElementById('cleared-count').innerText = clearedCount;
            document.getElementById('level-display').innerText = `Lv.${level} Wi-Fi`;

            items.forEach((item, i) => {
                const costEl = document.getElementById(`cost-${i}`);
                if(costEl) costEl.innerText = `$ ${item.cost.toLocaleString()}`;
                const countEl = document.getElementById(`count-${i}`);
                if(countEl) countEl.innerText = item.count;
                const el = document.getElementById(`item-${i}`);
                if (score < item.cost) el.classList.add('disabled'); else el.classList.remove('disabled');
            });
        }

        function triggerClearSequence() {
            if (isLevelingUp) return;
            score = targetScore; updateUI(); isLevelingUp = true;
            setTimeout(() => {
                const f = document.createElement('div');
                f.style.position = 'fixed'; f.style.top = '0'; f.style.left = '0'; f.style.width = '100%'; f.style.height = '100%';
                f.style.background = 'white'; f.style.zIndex = '1000'; f.style.opacity = '0'; f.style.transition = 'opacity 0.4s';
                document.body.appendChild(f);
                requestAnimationFrame(() => {
                    f.style.opacity = '1';
                    setTimeout(() => {
                        clearedCount++; level++; score = 0;
                        targetScore = Math.floor(3000 * Math.pow(5, level - 1));
                        f.style.opacity = '0';
                        setTimeout(() => { f.remove(); isLevelingUp = false; updateUI(); }, 400);
                    }, 500);
                });
            }, 600);
        }

        setInterval(() => {
            if (isLevelingUp) return;
            let mps = getTotalMps();
            if (mps > 0) {
                score += (mps / 10);
                if (score >= targetScore) triggerClearSequence();
                else updateUI();
            }
        }, 100);

        initShop();
        const wrapper = document.getElementById('wifi-wrapper');
        wrapper.addEventListener('touchstart', handleAction, { passive: false });
        wrapper.addEventListener('mousedown', handleAction);
        updateUI(); // 初回表示
    </script>
</body>
</html>
