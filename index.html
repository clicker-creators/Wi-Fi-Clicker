<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wi-Fiクリッカー - Clicker Creators</title>
    <style>
        body {
            margin: 0; padding: 0; width: 100%; height: 100dvh; overflow: hidden;
            background: radial-gradient(circle at center, #1a4a72 0%, #051622 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        #collection-counter {
            position: absolute; top: 20px; right: 20px; color: white;
            font-size: 20px; font-weight: bold; background: rgba(255,255,255,0.1);
            padding: 5px 15px; border-radius: 20px; z-index: 100;
        }

        #score-container { position: absolute; top: 10dvh; text-align: center; z-index: 10; pointer-events: none; }
        #score-display { font-size: 56px; color: white; font-weight: 900; text-shadow: 0 0 20px rgba(255,255,255,0.6); }
        #unit { font-size: 24px; color: #87CEEB; margin-top: -5px; }
        #level-display { color: #87CEEB; font-weight: bold; letter-spacing: 2px; }

        #wifi-wrapper {
            width: 80vmin; height: 80vmin;
            position: relative;
            cursor: pointer;
            z-index: 5;
        }

        .wifi-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .wifi-path {
            fill: none;
            stroke-width: 2.2px;
            stroke-linecap: butt; /* カクカク */
        }

        .plus-one {
            position: absolute; color: white; font-weight: bold; font-size: 32px;
            pointer-events: none; z-index: 20; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        @keyframes flashEffect {
            0% { background-color: white; opacity: 0.8; }
            100% { background-color: transparent; opacity: 0; }
        }
        .clear-flash { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 200; }
    </style>
</head>
<body>

    <div id="collection-counter">📡 × <span id="cleared-count">0</span></div>

    <div id="score-container">
        <div id="level-display">Lv.1 Wi-Fi</div>
        <div id="score-display">0</div>
        <div id="unit">Mbps</div>
    </div>

    <div id="wifi-wrapper">
        <svg id="wifi-svg" style="width:100%; height:100%; position:absolute; top:0; left:0;" viewBox="0 0 24 24">
            <defs>
                <filter id="outline-filter">
                    <feMorphology operator="dilate" radius="0.3" in="SourceGraphic" result="dilated"/>
                    <feFlood flood-color="black" result="black"/>
                    <feComposite in="black" in2="dilated" operator="in" result="outline"/>
                    <feComposite in="SourceGraphic" in2="outline" operator="over"/>
                </filter>
                
                <clipPath id="water-clip">
                    <rect id="water-rect" x="0" y="21" width="24" height="24" />
                </clipPath>
            </defs>
            
            <g filter="url(#outline-filter)">
                <g stroke="#444444" fill="none" stroke-width="2.2" stroke-linecap="butt">
                    <circle cx="12" cy="18" r="2.2" fill="#444444" stroke="none" />
                    <path d="M8.5 14a6 6 0 0 1 7 0" />
                    <path d="M5 10.5a11 11 0 0 1 14 0" />
                    <path d="M1.5 7a16 16 0 0 1 21 0" />
                </g>

                <g clip-path="url(#water-clip)" stroke="#FFFFFF" fill="none" stroke-width="2.2" stroke-linecap="butt">
                    <circle cx="12" cy="18" r="2.2" fill="#FFFFFF" stroke="none" />
                    <path d="M8.5 14a6 6 0 0 1 7 0" stroke="#FFFFFF" />
                    <path d="M5 10.5a11 11 0 0 1 14 0" stroke="#FFFFFF" />
                    <path d="M1.5 7a16 16 0 0 1 21 0" stroke="#FFFFFF" />
                </g>
            </g>
        </svg>
    </div>

    <script>
        let score = 0;
        let clearedCount = 0;
        let level = 1;
        const targetScore = 3000;

        const scoreDisplay = document.getElementById('score-display');
        const levelDisplay = document.getElementById('level-display');
        const clearedDisplay = document.getElementById('cleared-count');
        const wifiWrapper = document.getElementById('wifi-wrapper');
        const waterRect = document.getElementById('water-rect');

        // Y座標の基準点 (SVG座標 0〜24。数字が小さいほど上)
        // 各パーツの上端Y座標を精密に計算
        const Y_START = 21;    // スタート（丸の下）
        const Y1 = 15.8;     // Mbps 100 (丸の上端)
        const Y2 = 12.87;    // Mbps 500 (二番目の線の上端)
        const Y3 = 7.98;     // Mbps 1000 (三番目の線の上端)
        const Y4 = 3.07;     // Mbps 3000 (一番上の線の上端)

        function handleAction(e) {
            if (e.cancelable) e.preventDefault();
            
            score++;
            updateUI();

            if (score >= targetScore) {
                completeLevel();
            } else {
                const x = e.clientX || (e.touches && e.touches[0].clientX);
                const y = e.clientY || (e.touches && e.touches[0].clientY);
                if (x && y) createPlusOne(x, y);
            }
        }

        function updateUI() {
            scoreDisplay.innerText = score.toLocaleString();
            
            // 非線形水位制御：スコアに応じて、Y座標を各目標点に向かって減らす
            let currentY;

            if (score <= 100) {
                // 0 -> 100 Mbps: START -> Y1
                let progress = score / 100;
                currentY = Y_START - ((Y_START - Y1) * progress);
            } else if (score <= 500) {
                // 100 -> 500 Mbps: Y1 -> Y2
                let progress = (score - 100) / (500 - 100);
                currentY = Y1 - ((Y1 - Y2) * progress);
            } else if (score <= 1000) {
                // 500 -> 1000 Mbps: Y2 -> Y3
                let progress = (score - 500) / (1000 - 500);
                currentY = Y2 - ((Y2 - Y3) * progress);
            } else if (score <= 3000) {
                // 1000 -> 3000 Mbps: Y3 -> Y4
                let progress = (score - 1000) / (3000 - 1000);
                currentY = Y3 - ((Y3 - Y4) * progress);
            } else {
                // 3000 Mbps以上: Y4 (全埋まり)
                currentY = Y4;
            }

            // クリップパスの四角形のY座標を更新して水位を表現
            waterRect.setAttribute('y', currentY);
        }

        function completeLevel() {
            clearedCount++;
            level++;
            score = 0;

            const f = document.createElement('div');
            f.className = 'clear-flash';
            f.style.animation = 'flashEffect 0.5s ease-out';
            document.body.appendChild(f);
            setTimeout(() => f.remove(), 500);

            clearedDisplay.innerText = clearedCount;
            levelDisplay.innerText = `Lv.${level} Wi-Fi`;
            updateUI();
        }

        function createPlusOne(x, y) {
            const el = document.createElement('div');
            el.className = 'plus-one';
            el.innerText = '+1';
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            el.style.transform = 'translate(-50%, -50%)';
            document.body.appendChild(el);

            el.animate([
                { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                { transform: 'translate(-50%, -150px) scale(1.5)', opacity: 0 }
            ], { duration: 600, easing: 'ease-out' }).onfinish = () => el.remove();
        }

        wifiWrapper.addEventListener('touchstart', handleAction, { passive: false });
        wifiWrapper.addEventListener('mousedown', (e) => {
            if (window.ontouchstart === undefined) {
                handleAction(e);
            }
        });
    </script>
</body>
</html>
